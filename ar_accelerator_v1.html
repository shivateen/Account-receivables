<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Accelerator v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ========================================================================
   DESIGN SYSTEM
   Warm off-white background · hairline borders · serif headlines
   Single accent (teal-blue) · scoped semantic colors · tabular numerics
   No shadows · no gradients · no emoji
======================================================================== */

:root {
  --bg: #FAFAF7;
  --bg-2: #F2F1EC;
  --bg-3: #E8E6DF;
  --surface: #FFFFFF;
  --surface-2: #F6F5F0;

  --ink: #1A1D24;
  --ink-2: #4A4F5C;
  --ink-3: #7D8290;
  --ink-4: #A8ACB5;

  --line: #DCDDD8;
  --line-2: #C2C4BE;
  --line-strong: #A8ACB5;

  --accent: #1E5F8E;
  --accent-2: #16486E;
  --accent-tint: #E8F0F7;

  --agent: #6D4B9C;
  --agent-tint: #EEEAF4;

  --ok: #1A6E51;
  --ok-tint: #E6F0EC;
  --warn: #8B5A1F;
  --warn-tint: #F3EBDD;
  --alert: #A04030;
  --alert-tint: #F2E3DF;

  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;

  --radius: 6px;
  --radius-sm: 4px;
  --radius-lg: 10px;
}

.dark {
  --bg: #0E1218;
  --bg-2: #161B23;
  --bg-3: #1E242E;
  --surface: #161B23;
  --surface-2: #1A2029;
  --ink: #E8E6DC;
  --ink-2: #BBC0CA;
  --ink-3: #8A91A0;
  --ink-4: #5C6478;
  --line: #232932;
  --line-2: #2E3540;
  --line-strong: #4A5260;
  --accent: #4A9BD0;
  --accent-2: #6CB0DE;
  --accent-tint: rgba(74,155,208,0.10);
  --agent: #A088D0;
  --agent-tint: rgba(160,136,208,0.10);
  --ok: #4FB892;
  --ok-tint: rgba(79,184,146,0.10);
  --warn: #D9A155;
  --warn-tint: rgba(217,161,85,0.10);
  --alert: #D9806B;
  --alert-tint: rgba(217,128,107,0.10);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums;
}

.num, .stat, .kpi-val, .signal-amt, .pill, .meta-num, table td, table th {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum';
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }

.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.trust-strip {
  height: 36px;
  background: var(--surface);
  border-bottom: 0.5px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  flex-shrink: 0;
  font-size: 12px;
  color: var(--ink-2);
}
.trust-strip.amber { background: var(--warn-tint); border-bottom-color: var(--warn); }
.ts-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex-shrink: 0;
}
.trust-strip.amber .ts-dot { background: var(--warn); }
.ts-sep { color: var(--ink-4); }
.ts-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.ts-link { color: var(--ink-2); cursor: pointer; }
.ts-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.theme-tog {
  display: flex; align-items: center; gap: 4px;
  border: 0.5px solid var(--line);
  border-radius: 14px;
  padding: 3px 4px;
  font-size: 10px;
}
.theme-tog button { padding: 2px 7px; border-radius: 10px; color: var(--ink-3); font-size: 10px; }
.theme-tog button.on { background: var(--ink); color: var(--bg); }

.topbar {
  height: 56px;
  background: var(--surface);
  border-bottom: 0.5px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 24px;
  flex-shrink: 0;
}
.brand {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
  font-style: italic;
}
.brand-sub {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--ink-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding-left: 10px;
  margin-left: 10px;
  border-left: 0.5px solid var(--line);
}
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.context-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 11px;
  font-size: 11px;
  color: var(--ink-2);
  background: var(--bg-2);
  border: 0.5px solid var(--line);
  border-radius: 14px;
}
.context-pill .lbl { color: var(--ink-3); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }

.body { display: flex; flex: 1; overflow: hidden; }

.rail {
  width: 200px;
  background: var(--surface);
  border-right: 0.5px solid var(--line);
  padding: 16px 0;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.rail-section { padding: 8px 16px 4px; }
.rail-section-label {
  font-size: 9px;
  font-family: var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 6px;
  padding-left: 4px;
}
.rail-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--ink-2);
  font-size: 13px;
  margin-bottom: 1px;
  position: relative;
  transition: background 0.12s, color 0.12s;
}
.rail-item:hover { background: var(--bg-2); color: var(--ink); }
.rail-item.active { color: var(--ink); font-weight: 500; }
.rail-item.active::before {
  content: '';
  position: absolute;
  left: -16px;
  top: 6px; bottom: 6px;
  width: 2px;
  background: var(--ink);
}
.rail-icon {
  width: 16px; height: 16px;
  display: inline-flex;
  align-items: center; justify-content: center;
  flex-shrink: 0;
  color: var(--ink-3);
}
.rail-item.active .rail-icon { color: var(--ink); }
.rail-item svg { width: 16px; height: 16px; stroke-width: 1.5; }
.rail-divider { height: 0.5px; background: var(--line); margin: 12px 16px; }

.main { flex: 1; overflow-y: auto; background: var(--bg); }
.main::-webkit-scrollbar { width: 8px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.main::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }

.page { padding: 32px 40px 64px; max-width: 1280px; }
.page .section-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 20px; }
.page .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-4); }
.page .h1 { font-family: var(--serif); font-size: 42px; line-height: 1.05; max-width: 12ch; margin-top: 10px; margin-bottom: 18px; color: var(--ink); }
.page .lede { max-width: 68ch; color: var(--ink-2); font-size: 15px; line-height: 1.75; }

.btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 11px 18px; font-size: 13px; font-weight: 600; border: 0.5px solid transparent; transition: background 0.15s, color 0.15s, border-color 0.15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-2); }
.btn-secondary { background: var(--bg-2); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover { background: var(--surface); }
.btn-text { color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.btn-text:hover { color: var(--ink); }

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.spacer { flex: 1; }

.card { background: var(--surface); border: 0.5px solid var(--line); border-radius: var(--radius); padding: 20px; }
.card-tight { background: var(--surface); border: 0.5px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card-loose { background: var(--surface); border: 0.5px solid var(--line); border-radius: var(--radius); padding: 26px; }

  .vision-hero {
    padding: 40px 0 32px;
    border-bottom: 0.5px solid var(--line);
    margin-bottom: 32px;
  }
  .vision-hero .eyebrow { margin-bottom: 18px; }
  .vision-hero .h1 { max-width: 22ch; margin-bottom: 18px; }
  .vision-hero .lede { max-width: 60ch; }

  .maturity-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }
  .pillar-card {
    background: var(--surface);
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .pillar-card .eyebrow { color: var(--accent); }
  .pillar-name {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.2;
    color: var(--ink);
  }
  .pillar-desc {
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-2);
  }
  .maturity-track {
    position: relative;
    margin-top: 8px;
    padding-top: 24px;
  }
  .maturity-bar {
    position: relative;
    height: 4px;
    background: var(--bg-3);
    border-radius: 2px;
  }
  .maturity-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--ink-2);
    border-radius: 2px;
  }
  .maturity-marker {
    position: absolute;
    top: -7px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--ink);
    transform: translateX(-50%);
  }
  .maturity-marker.target { background: var(--accent); border-color: var(--accent); }
  .maturity-marker-label {
    position: absolute;
    top: -28px;
    transform: translateX(-50%);
    font-size: 9px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .maturity-stages {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 10px;
    font-family: var(--mono);
    color: var(--ink-4);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .pillar-gap {
    display: flex;
    gap: 24px;
    padding-top: 8px;
    border-top: 0.5px solid var(--line);
    margin-top: 4px;
  }
  .pillar-gap-item { display: flex; flex-direction: column; gap: 2px; }
  .pillar-gap-label {
    font-size: 10px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-family: var(--mono);
  }
  .pillar-gap-val {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    color: var(--ink);
  }
  .vision-prize {
    margin-top: 40px;
    padding: 32px 40px;
    background: var(--surface);
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 48px;
    align-items: center;
  }
  .prize-stat {
    font-family: var(--serif);
    font-size: 56px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .prize-stat-label {
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: 12px;
  }
  .prize-narrative { font-size: 14px; line-height: 1.7; color: var(--ink-2); }
  .prize-narrative b { color: var(--ink); font-weight: 500; }

  .signal-summary {
    margin-bottom: 24px;
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink);
    max-width: 56ch;
  }
  .signal-card {
    background: var(--surface);
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    position: relative;
    transition: border-color 0.15s;
  }
  .signal-card:hover { border-color: var(--line-strong); }
  .signal-card.alert { border-left: 2px solid var(--alert); }
  .signal-card.warn { border-left: 2px solid var(--warn); }
  .signal-card.info { border-left: 2px solid var(--accent); }

  .signal-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .signal-pattern {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--ink-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .signal-conf { margin-left: auto; font-size: 11px; color: var(--ink-3); }

  .signal-headline {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    line-height: 1.25;
    color: var(--ink);
    margin-bottom: 14px;
    max-width: 56ch;
  }
  .signal-body {
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink-2);
    margin-bottom: 14px;
    max-width: 68ch;
  }
  .signal-body p { margin-bottom: 10px; }
  .signal-body p:last-child { margin-bottom: 0; }
  .signal-body b { color: var(--ink); font-weight: 500; }

  .signal-footer {
    display: flex;
    align-items: center;
    gap: 24px;
    padding-top: 12px;
    border-top: 0.5px solid var(--line);
  }
  .signal-footer .stat {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .signal-footer .stat-label {
    font-size: 9px;
    font-family: var(--mono);
    color: var(--ink-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .signal-footer .stat-val {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .signal-footer .actions { margin-left: auto; display: flex; gap: 20px; }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-3);
    margin-bottom: 20px;
  }
  .breadcrumb a { cursor: pointer; }
  .breadcrumb a:hover { color: var(--ink); }
  .breadcrumb .sep { color: var(--ink-4); }
  .breadcrumb .current { color: var(--ink); }

  .descent-header {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 0.5px solid var(--line);
  }
  .descent-header .eyebrow { margin-bottom: 10px; }
  .descent-header .h2 { max-width: 40ch; margin-bottom: 12px; }
  .descent-header .lede { max-width: 64ch; }

  .roadmap-hero {
    padding-bottom: 24px;
    border-bottom: 0.5px solid var(--line);
    margin-bottom: 28px;
  }
  .roadmap-timeline {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    margin-top: 24px;
  }
  .phase {
    border-left: 0.5px solid var(--line-2);
    padding: 0 0 32px 24px;
    margin-left: 8px;
    position: relative;
  }
  .phase::before {
    content: '';
    position: absolute;
    left: -7px;
    top: 0;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--surface);
    border: 1.5px solid var(--ink);
  }
  .phase.open { border-left-color: var(--ink); }
  .phase-meta {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--ink-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .phase-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 12px;
    max-width: 32ch;
  }
  .phase-desc {
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-2);
    margin-bottom: 16px;
    max-width: 60ch;
  }
  .phase-items {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 16px;
  }
  .phase-item {
    background: var(--bg-2);
    border: 0.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .phase-item-label {
    font-size: 9px;
    font-family: var(--mono);
    color: var(--ink-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .phase-item-text {
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink-2);
  }
  .phase-prize {
    margin-top: 18px;
    padding: 14px 16px;
    background: var(--ok-tint);
    border-left: 2px solid var(--ok);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--ink);
    line-height: 1.55;
  }
  .phase-prize b { color: var(--ok); font-weight: 500; }

  .agent-container { max-width: 760px; }
  .agent-intro { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 0.5px solid var(--line); }
  .agent-suggestion-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
  .agent-suggestion {
    padding: 8px 14px;
    border: 0.5px solid var(--line-2);
    border-radius: 20px;
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all 0.12s;
    background: var(--surface);
  }
  .agent-suggestion:hover { border-color: var(--agent); color: var(--ink); background: var(--agent-tint); }

  .agent-context {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg-2);
    border: 0.5px solid var(--line);
    border-radius: 20px;
    font-size: 11px;
    color: var(--ink-3);
    margin-bottom: 16px;
    width: fit-content;
  }
  .agent-context .dot { background: var(--agent); width: 8px; height: 8px; border-radius: 50%; }

  .msg-user { display: flex; justify-content: flex-end; margin-bottom: 20px; }
  .msg-user-bubble {
    background: var(--bg-2);
    border: 0.5px solid var(--line);
    padding: 10px 14px;
    border-radius: var(--radius-lg);
    font-size: 13px;
    max-width: 75%;
    line-height: 1.55;
    color: var(--ink);
  }

  .msg-agent {
    display: flex;
    gap: 14px;
    margin-bottom: 32px;
  }
  .msg-agent::before {
    content: '';
    width: 2px;
    background: var(--agent);
    flex-shrink: 0;
    border-radius: 2px;
  }
  .msg-agent-body {
    flex: 1;
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink-2);
  }
  .msg-agent-body h4 {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 10px;
    margin-top: 0;
  }
  .msg-agent-body p { margin-bottom: 12px; }
  .msg-agent-body p:last-child { margin-bottom: 0; }
  .msg-agent-body ul { padding-left: 20px; margin-bottom: 12px; }
  .msg-agent-body li { margin-bottom: 6px; }
  .msg-agent-body b { color: var(--ink); font-weight: 500; }

  .agent-mode-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 28px;
    border-bottom: 0.5px solid var(--line);
  }
  .agent-mode-tab {
    padding: 10px 18px 12px;
    font-size: 13px;
    color: var(--ink-3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -0.5px;
    font-weight: 500;
  }
  .agent-mode-tab:hover { color: var(--ink-2); }
  .agent-mode-tab.active {
    color: var(--ink);
    border-bottom-color: var(--agent);
  }
  .agent-mode-tab .count {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--ink-3);
    margin-left: 4px;
  }

  .agent-cat-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .agent-cat-card {
    background: var(--surface);
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 22px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 18px;
    align-items: start;
    transition: border-color 0.15s;
  }
  .agent-cat-card:hover { border-color: var(--line-strong); }
  .agent-cat-card.armed { border-left: 2px solid var(--agent); }
  .agent-cat-card.dormant { opacity: 0.85; }

  .agent-cat-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--agent-tint);
    color: var(--agent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .agent-cat-icon svg { width: 18px; height: 18px; stroke-width: 1.5; }

  .agent-cat-body { min-width: 0; }
  .agent-cat-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .agent-cat-id {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--agent);
    letter-spacing: 0.06em;
    font-weight: 500;
  }
  .agent-cat-name {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
  }
  .agent-cat-state {
    font-size: 9px;
    font-family: var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 8px;
  }
  .agent-cat-state.armed { background: var(--agent-tint); color: var(--agent); }
  .agent-cat-state.dormant { background: var(--bg-2); color: var(--ink-3); }
  .agent-cat-state.executing { background: var(--ok-tint); color: var(--ok); }

  .agent-cat-desc {
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink-2);
    margin-bottom: 10px;
    max-width: 72ch;
  }
  .agent-cat-meta { font-size: 12px; color: var(--ink-3); }

  .metrics-areas {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  .area-card {
    background: var(--surface);
    border: 0.5px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .area-card:hover { border-color: var(--line-strong); }
  .area-card.open { border-color: var(--line-strong); }
  .area-head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
  }
  .area-head:hover { background: var(--surface-2); }
  .area-head-main { flex: 1; min-width: 0; }
  .area-name {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.005em;
  }
  .area-desc {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 3px;
    line-height: 1.5;
  }
  .area-summary {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }
  .area-stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
  }
  .area-stat .stat-val { font-family: var(--serif); font-size: 18px; font-weight: 600; color: var(--ink); }
  .area-stat .stat-label { font-size: 10px; font-family: var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }

  .bench-grid { display:flex; gap:8px; flex-wrap: wrap; }
  .metric-spark { width:160px; height:48px; display:block; }
  .stat-row { display:flex; gap:12px; align-items:center; }

  .grid-2 { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:16px; }
  .grid-3 { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:16px; }
  .detail-grid { display:grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.4fr); gap:18px; }
  .value-block { border: 0.5px solid var(--line); background: var(--bg-2); border-radius: var(--radius); padding: 16px; }
  .value-block .meta { margin-bottom: 6px; }
  .value-block .value { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--ink); }
  .detail-actions { display:flex; gap:12px; flex-wrap: wrap; margin-top: 16px; }
  .section-actions { display:flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
  .section-grid { display:grid; gap:16px; margin-top:18px; }
  .section-spaced { margin-top: 28px; }
  .margin-top-sm { margin-top: 8px; }
  .margin-top-xs { margin-top: 6px; }
  .step-label { margin-top:4px; }
  .recommend-grid { display:grid; gap:12px; margin-top:14px; }
  .pillar-card[data-current] .maturity-fill { width: 0%; }
  .pillar-card[data-current] .maturity-marker.current { left: 0%; }
  .pillar-card[data-target] .maturity-marker.target { left: 0%; }
  .back-link { display:inline-flex; align-items:center; gap:8px; color: var(--ink-2); font-size:13px; cursor:pointer; }
  .back-link:hover { color: var(--ink); }
  .signal-list { display:flex; flex-direction:column; gap:14px; margin-top:18px; }
  .kpi-delta { margin-top:6px; color: var(--ink-3); }
  .btn-arrow { display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .evidence-list { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .context-footer { margin-top:12px; padding-top:12px; border-top:0.5px solid var(--line); color:var(--ink-3); display:flex; gap:10px; align-items:center; }
  .context-flag { width:20px; height:20px; background:var(--agent); border-radius:4px; flex-shrink:0; }
  .agent-chat-panel { display:flex; flex-direction:column; gap:12px; }
  .agent-chat-input { display:flex; gap:8px; margin-top:12px; }
  .agent-chat-input input { flex:1; border: 0.5px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--surface); color: var(--ink); }
  .agent-chat-input input:focus { outline: none; border-color: var(--accent); }
  .agent-cat-actions { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .card-clickable { cursor:pointer; }
  .card-clickable:hover { background: var(--surface-2); }
  .metric-detail-grid { display:grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.4fr); gap:18px; margin-top:12px; }
  .metric-root { margin-top:8px; color:var(--ink-2); }
  .stats-grid { display:grid; gap:12px; margin-top:14px; }
  .action-line { margin-top:8px; }
  .rail-footer { margin-top:auto; padding-top:16px; }
  .small-table { width:100%; border-collapse:collapse; }
  .small-table th, .small-table td { padding: 10px 12px; text-align:left; border-bottom: 0.5px solid var(--line); }
  .small-table th { color: var(--ink-3); font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .small-table td { color: var(--ink-2); }
  .small-table td:first-child { color: var(--accent); font-family: var(--mono); }
  .config-panel { display:grid; grid-template-columns: 360px 1fr; gap:16px; }
  .org-card { min-width: 320px; }
  .org-grid { display:flex; gap:12px; flex-wrap:wrap; }
  .org-grid .card { flex:1; }
  .org-rows { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:18px; margin-top:12px; }
  .org-pill { padding:6px 10px; border-radius: 999px; background: var(--bg-2); font-size: 12px; }
  .kpi-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:12px; }
  .kpi-card { padding: 18px; }
  .kpi-value { font-family: var(--serif); font-size: 22px; font-weight: 700; margin-top: 8px; }

  .h2 { font-family: var(--serif); font-size: 30px; line-height: 1.1; color: var(--ink); margin: 12px 0; }
  .h3 { font-family: var(--serif); font-size: 22px; line-height: 1.2; color: var(--ink); }
  .agent-suggestion-row { margin-bottom: 32px; }

  .light-mode .signal-card.alert { border-left-color: var(--alert); }
  .light-mode .signal-card.warn { border-left-color: var(--warn); }

  .meta { color: var(--ink-3); font-size: 12px; }
  .page { padding: 24px 28px 48px; }
}
@media (max-width: 700px) {
  .rail { width: 56px; }
  .rail-item .rail-label { display: none; }
  .page { padding: 18px 12px 36px; }
}
/* small animations */
.fade-in { animation: fadeIn 240ms ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const STATE = {
  page: 'vision',
  theme: 'light',
  trustOk: true
};

const ICONS = {
  vision: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12 22 12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  diagnose: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  metrics: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>',
  agent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  roadmap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3"/><path d="M9 12h3"/><path d="M15 12h3"/><path d="M21 12h0"/><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>',
  configure: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.93 19.07 1.41-1.41"/><path d="m17.66 6.34 1.41-1.41"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>'
};

// VISION data for AR Accelerator
const VISION = {
  pillars: [
    { id: 'sense', eyebrow: 'PILLAR I', name: 'Continuous sensing', desc: 'Every order, invoice and payment generates signals in near real-time.', currentStage: 1, targetStage: 4, stages: ['Manual reporting','Daily extracts','Hourly refresh','Real-time signals','Predictive sensing'], currentLabel: 'Daily', targetLabel: 'Real-time', gap: { label: 'Signal latency', current: '24 hrs', future: '< 5 min' } },
    { id: 'diagnose', eyebrow: 'PILLAR II', name: 'Self-explaining diagnostics', desc: 'Root cause is computed, not investigated; evidence chains tie to SAP records.', currentStage: 1, targetStage: 4, stages: ['Static dashboards','Drill-down OLAP','Triggered analysis','Self-explaining','Predictive RCA'], currentLabel: 'Drill-down', targetLabel: 'Self-explaining', gap: { label: 'Time to RCA', current: '3-5 days', future: '< 5 min' } },
    { id: 'decide', eyebrow: 'PILLAR III', name: 'Agentic recommendations', desc: 'Pre-sized, policy-checked recommendations queued for human approval.', currentStage: 0, targetStage: 3, stages: ['Reactive','Reports','Suggested actions','Pre-sized actions','Autonomous'], currentLabel: 'Reactive', targetLabel: 'Pre-sized actions', gap: { label: 'Decision latency', current: '5-10 days', future: '< 1 hr' } },
    { id: 'act', eyebrow: 'PILLAR IV', name: 'Closed-loop execution', desc: 'Approved actions write back to SAP with audit and outcome attribution.', currentStage: 0, targetStage: 3, stages: ['Manual SAP entry','BAPI batch','Approved write-back','Outcome-attributed','Closed-loop learning'], currentLabel: 'Manual SAP', targetLabel: 'Outcome-attributed', gap: { label: 'Action close rate', current: '38%', future: '> 92%' } }
  ],
  prize: { stat: '$28M', label: 'Working capital release by month 18', narrative: 'Recover 8–14 days of DSO and redirect analyst hours to customer engagement. The diagnostic accelerator measures the gap, prioritises the journey, and proves recovery against the GL.' }
};

const ORG_DESIGN = {
  today: {
    label: 'Today — incident-driven finance', headcount: '72', headcountLabel: 'FTE', monthEndDays: 8, closeLabel: 'Month-end', signalLatency: '24h', latencyLabel: 'Daily', decisionLatency: '7 days', decisionLabel: 'Weekly', roles: [ { name: 'Collections analyst', count: 28, tag: 'Frontline' }, { name: 'Cash app specialist', count: 12, tag: 'Operational' }, { name: 'Dispute SME', count: 10, tag: 'Operational' }, { name: 'Controller', count: 6, tag: 'Oversight' } ], decisions: [ { text: 'Approve write-backs', new: false }, { text: 'Manual block overrides', new: false } ], cadence: { close: 'Monthly', report: 'Weekly', attest: 'Quarterly' }
  },
  future: {
    label: 'Month 18 — real-time finance', headcount: '68', headcountLabel: 'FTE (rebalanced)', monthEndDays: 2, closeLabel: 'Continuous', signalLatency: '<5m', latencyLabel: 'Real-time', decisionLatency: '1 hr', decisionLabel: 'Near real-time', roles: [ { name: 'AR strategist', count: 8, tag: 'Value' }, { name: 'Agent ops', count: 6, tag: 'Governance' }, { name: 'Analytics engineer', count: 12, tag: 'Platform' }, { name: 'Controller', count: 6, tag: 'Oversight' } ], decisions: [ { text: 'Authorize autonomous actions', new: true }, { text: 'Set policy thresholds', new: true } ], cadence: { close: 'Continuous', report: 'Daily', attest: 'Continuous' }
  },
  narrative: 'The operating model shifts from manual transaction handling to outcome ownership: humans approve and strategic teams measure outcome attribution.'
};

function renderPillarCard(p) {
  const stageCount = p.stages.length - 1;
  const currentPct = (p.currentStage / stageCount) * 100;
  const targetPct = (p.targetStage / stageCount) * 100;
  return `<div class="pillar-card" data-current="${currentPct}" data-target="${targetPct}">
    <div class="eyebrow">${p.eyebrow}</div>
    <div class="pillar-name">${p.name}</div>
    <div class="pillar-desc">${p.desc}</div>
    <div class="maturity-track">
      <div class="maturity-bar"><div class="maturity-fill"></div></div>
      <div class="maturity-marker current"><span class="maturity-marker-label">Current</span></div>
      <div class="maturity-marker target"><span class="maturity-marker-label">M18</span></div>
      <div class="maturity-stages">${p.stages.map(stage => `<span>${stage}</span>`).join('')}</div>
    </div>
    <div class="pillar-gap">
      <div class="pillar-gap-item"><div class="pillar-gap-label">${p.gap.label}</div><div class="pillar-gap-val">${p.gap.current}</div></div>
      <div class="pillar-gap-item"><div class="pillar-gap-label">Target</div><div class="pillar-gap-val">${p.gap.future}</div></div>
    </div>
  </div>`;
}

function renderOrgCard(org, kind) {
  return `<div class="card card-tight org-card">
    <div class="eyebrow">${kind === 'today' ? 'Today' : 'Month 18'}</div>
    <div class="h3 margin-top-xs">${org.label}</div>
    <div class="org-rows">
      <div class="value-block"><div class="meta">O2C headcount</div><div class="value">${org.headcount}</div><div class="meta">${org.headcountLabel}</div></div>
      <div class="value-block"><div class="meta">Close cadence</div><div class="value">${org.monthEndDays}d</div><div class="meta">${org.closeLabel}</div></div>
    </div>
    <div class="margin-top-sm"><div class="meta">Roles & headcount mix</div><div class="org-grid">${org.roles.map(r => `<div class="org-pill">${r.name} · ${r.count}</div>`).join('')}</div></div>
  </div>`;
}

function renderShell() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="trust-strip ${STATE.trustOk ? '' : 'amber'}">
      <span class="ts-dot"></span>
      <span class="ts-link" onclick="navTo('configure')">AR trust foundation · GL variance <span class="num">0.04%</span> · last reconciled 18 min ago</span>
      <span class="ts-sep">·</span>
      <span class="muted">5 signals active · 12 diagnostic rules engaged</span>
      <div class="ts-right">
        <span class="ts-link" onclick="openModal('reconciliation')">Reconciliation history ›</span>
        <div class="theme-tog">
          <button class="${STATE.theme==='light'?'on':''}" onclick="setTheme('light')">Light</button>
          <button class="${STATE.theme==='dark'?'on':''}" onclick="setTheme('dark')">Dark</button>
        </div>
      </div>
    </div>
    <div class="topbar">
      <span class="brand">AR Accelerator</span>
      <span class="brand-sub">Accounts Receivable transformation</span>
      <div class="topbar-right">
        <div class="context-pill"><span class="lbl">Customer</span> Continental Heavy</div>
        <div class="context-pill"><span class="lbl">Period</span> Q3 2026</div>
        <div class="context-pill"><span class="lbl">Scope</span> Collections · Cash App · Disputes · Deductions</div>
      </div>
    </div>
    <div class="body">
      <nav class="rail">
        <div class="rail-section">
          <div class="rail-section-label">Vision</div>
          ${renderNavItem('vision', 'Future state')}
        </div>
        <div class="rail-divider"></div>
        <div class="rail-section">
          <div class="rail-section-label">Today</div>
          ${renderNavItem('diagnose', 'Diagnose')}
          ${renderNavItem('metrics', 'Metrics')}
          ${renderNavItem('agent', 'Agent')}
        </div>
        <div class="rail-divider"></div>
        <div class="rail-section">
          <div class="rail-section-label">Journey</div>
          ${renderNavItem('roadmap', 'Roadmap')}
        </div>
        <div class="rail-divider"></div>
        <div class="rail-section rail-footer">
          <div class="rail-section-label">Setup</div>
          ${renderNavItem('configure', 'Trust foundation')}
        </div>
      </nav>
      <main class="main" id="main-content"></main>
    </div>
  `;
  renderPage();
}

function renderNavItem(id, label) {
  return `<div class="rail-item ${STATE.page === id ? 'active' : ''}" onclick="navTo('${id}')">
    <span class="rail-icon">${ICONS[id] || ''}</span>
    <span class="rail-label">${label}</span>
  </div>`;
}

function navTo(page) {
  STATE.page = page;
  renderShell();
}

function renderPage() {
  const main = document.getElementById('main-content');
  if (!main) return;
  if (STATE.selectedSignal) {
    main.innerHTML = renderDescent(STATE.selectedSignal);
    updateMaturityMarkers();
    return;
  }
  if (STATE.selectedMetric) {
    main.innerHTML = renderMetricDetail(STATE.selectedMetric);
    updateMaturityMarkers();
    return;
  }
  if (STATE.page === 'vision') main.innerHTML = renderVision();
  else if (STATE.page === 'diagnose') main.innerHTML = renderDiagnose();
  else if (STATE.page === 'metrics') main.innerHTML = renderMetrics();
  else if (STATE.page === 'agent') main.innerHTML = renderAgent();
  else if (STATE.page === 'roadmap') main.innerHTML = renderRoadmap();
  else if (STATE.page === 'configure') main.innerHTML = renderConfigure();
  updateMaturityMarkers();
}

function updateMaturityMarkers() {
  document.querySelectorAll('.pillar-card').forEach(card => {
    const current = Number(card.dataset.current) || 0;
    const target = Number(card.dataset.target) || 0;
    const fill = card.querySelector('.maturity-fill');
    const currentMarker = card.querySelector('.maturity-marker.current');
    const targetMarker = card.querySelector('.maturity-marker.target');
    if (fill) fill.style.width = `${current}%`;
    if (currentMarker) currentMarker.style.left = `${current}%`;
    if (targetMarker) targetMarker.style.left = `${target}%`;
  });
}

function renderVision() {
  return `<div class="page fade-in">
    <div class="vision-hero">
      <div class="eyebrow">Vision · AR transformation future state</div>
      <h1 class="h1">Finance moves from reactive collections to continuous AR operating model.</h1>
      <p class="lede">The AR Accelerator aligns Collections Management, Cash Application, Disputes, and Deductions behind a trust foundation, continuous sensing, and agentic execution — releasing working capital and creating operational capacity.</p>
    </div>

    <div class="section-head">
      <span class="eyebrow">Four pillars · where you are and where you're going</span>
      <span class="meta">Maturity assessment based on current baseline</span>
    </div>

    <div class="maturity-grid">
      ${VISION.pillars.map(p => renderPillarCard(p)).join('')}
    </div>

    <div class="vision-prize">
      <div>
        <div class="prize-stat">${VISION.prize.stat}</div>
        <div class="prize-stat-label">${VISION.prize.label}</div>
      </div>
      <div class="prize-narrative">${VISION.prize.narrative}</div>
    </div>

    <div class="section-head section-spaced">
      <span class="eyebrow">North-star organisation design</span>
      <span class="meta">Operational destination by month 18</span>
    </div>

    <div class="section-actions">
      ${renderOrgCard(ORG_DESIGN.today, 'today')}
      ${renderOrgCard(ORG_DESIGN.future, 'future')}
    </div>

    <div class="card card-loose section-spaced">
      <div class="eyebrow">The shift</div>
      <h3 class="h3 margin-top-xs">${ORG_DESIGN.narrative}</h3>
    </div>

    <div class="section-actions">
      <button class="btn btn-primary btn-arrow" onclick="navTo('roadmap')">See the roadmap ${ICONS.arrow}</button>
      <button class="btn btn-secondary" onclick="navTo('diagnose')">See current diagnostics</button>
    </div>
  </div>`;
}

function renderDiagnose() {
  const signalList = Object.values(SIGNALS);
  return `<div class="page fade-in">
    <div class="section-head">
      <div>
        <div class="eyebrow">Diagnose · current state</div>
        <h1 class="h1">Findings worth your attention this week.</h1>
      </div>
    </div>

    <div class="signal-summary">Click Investigate on any signal to view the evidence ladder, the implicated metric, and recommended action.</div>

    <div class="signal-list">
      ${signalList.map(s => renderSignalCard(s)).join('')}
    </div>

    <div class="section-spaced">${renderKpiSummary()}</div>

function generateSpark(m) {
  // normalize values to simple 4-bar spark (bic, median, current, laggard)
  const vals = [m.bic || 0, m.median || 0, m.val || 0, m.laggard || 0];
  const max = Math.max(...vals, 1);
  const bars = vals.map((v,i)=>{
    const h = Math.round((v / max) * 36) + 4; // ensure minimal height
    const color = i===2 ? 'var(--accent)' : i===0 ? 'var(--ok)' : i===3 ? 'var(--warn)' : 'var(--ink-3)';
    return `<rect x="${i*36}" y="${44-h}" width="24" height="${h}" rx="3" fill="${color}"></rect>`;
  }).join('');
  return `<svg class="metric-spark" viewBox="0 0 144 48" aria-hidden="true">${bars}</svg><div class="spark-caption">BIC · Median · Current · Laggard</div>`;
}
