<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O2C · Finance Transformation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ========================================================================
   DESIGN SYSTEM
   Warm off-white background · hairline borders · serif headlines
   Single accent (teal-blue) · scoped semantic colors · tabular numerals
   No shadows · no gradients · no emoji
======================================================================== */

:root {
  /* Surfaces */
  --bg: #FAFAF7;
  --bg-2: #F2F1EC;
  --bg-3: #E8E6DF;
  --surface: #FFFFFF;
  --surface-2: #F6F5F0;

  /* Text */
  --ink: #1A1D24;
  --ink-2: #4A4F5C;
  --ink-3: #7D8290;
  --ink-4: #A8ACB5;

  /* Borders */
  --line: #DCDDD8;
  --line-2: #C2C4BE;
  --line-strong: #A8ACB5;

  /* Accent — single primary brand color */
  --accent: #1E5F8E;
  --accent-2: #16486E;
  --accent-tint: #E8F0F7;

  /* Agent-specific (scoped) */
  --agent: #6D4B9C;
  --agent-tint: #EEEAF4;

  /* Semantic — scoped usage only */
  --ok: #1A6E51;
  --ok-tint: #E6F0EC;
  --warn: #8B5A1F;
  --warn-tint: #F3EBDD;
  --alert: #A04030;
  --alert-tint: #F2E3DF;

  /* Typography */
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;

  /* Geometry */
  --radius: 6px;
  --radius-sm: 4px;
  --radius-lg: 10px;
}

.dark {
  --bg: #0E1218;
  --bg-2: #161B23;
  --bg-3: #1E242E;
  --surface: #161B23;
  --surface-2: #1A2029;
  --ink: #E8E6DC;
  --ink-2: #BBC0CA;
  --ink-3: #8A91A0;
  --ink-4: #5C6478;
  --line: #232932;
  --line-2: #2E3540;
  --line-strong: #4A5260;
  --accent: #4A9BD0;
  --accent-2: #6CB0DE;
  --accent-tint: rgba(74,155,208,0.10);
  --agent: #A088D0;
  --agent-tint: rgba(160,136,208,0.10);
  --ok: #4FB892;
  --ok-tint: rgba(79,184,146,0.10);
  --warn: #D9A155;
  --warn-tint: rgba(217,161,85,0.10);
  --alert: #D9806B;
  --alert-tint: rgba(217,128,107,0.10);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums;
}

/* Apply tabular numerals to ALL numerical contexts */
.num, .stat, .kpi-val, .signal-amt, .pill, .ladder-stat, .meta-num, table td, table th {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum';
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* ========================================================================
   APP SHELL
======================================================================== */

.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* Trust strip — the persistent reconciliation surface */
.trust-strip {
  height: 36px;
  background: var(--surface);
  border-bottom: 0.5px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  flex-shrink: 0;
  font-size: 12px;
  color: var(--ink-2);
}
.trust-strip.amber { background: var(--warn-tint); border-bottom-color: var(--warn); }
.ts-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok);
  flex-shrink: 0;
}
.trust-strip.amber .ts-dot { background: var(--warn); }
.ts-sep { color: var(--ink-4); }
.ts-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.ts-link { color: var(--ink-2); cursor: pointer; }
.ts-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.theme-tog {
  display: flex; align-items: center; gap: 4px;
  border: 0.5px solid var(--line); border-radius: 14px;
  padding: 3px 4px; font-size: 10px;
}
.theme-tog button { padding: 2px 7px; border-radius: 10px; color: var(--ink-3); font-size: 10px; }
.theme-tog button.on { background: var(--ink); color: var(--bg); }

/* Top bar */
.topbar {
  height: 56px;
  background: var(--surface);
  border-bottom: 0.5px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 24px;
  flex-shrink: 0;
}
.brand {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
  font-style: italic;
}
.brand-sub {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--ink-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding-left: 10px;
  margin-left: 10px;
  border-left: 0.5px solid var(--line);
}
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.context-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 11px;
  font-size: 11px;
  color: var(--ink-2);
  background: var(--bg-2);
  border: 0.5px solid var(--line);
  border-radius: 14px;
}
.context-pill .lbl { color: var(--ink-3); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }

/* Body */
.body { display: flex; flex: 1; overflow: hidden; }

/* Left rail navigation — minimal, 5 surfaces */
.rail {
  width: 200px;
  background: var(--surface);
  border-right: 0.5px solid var(--line);
  padding: 16px 0;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.rail-section { padding: 8px 16px 4px; }
.rail-section-label {
  font-size: 9px;
  font-family: var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 6px;
  padding-left: 4px;
}
.rail-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--ink-2);
  font-size: 13px;
  margin-bottom: 1px;
  position: relative;
  transition: background 0.12s, color 0.12s;
}
.rail-item:hover { background: var(--bg-2); color: var(--ink); }
.rail-item.active { color: var(--ink); font-weight: 500; }
.rail-item.active::before {
  content: '';
  position: absolute;
  left: -16px;
  top: 6px; bottom: 6px;
  width: 2px;
  background: var(--ink);
}
.rail-icon {
  width: 16px; height: 16px;
  display: inline-flex;
  align-items: center; justify-content: center;
  flex-shrink: 0;
  color: var(--ink-3);
}
.rail-item.active .rail-icon { color: var(--ink); }
.rail-item svg { width: 16px; height: 16px; stroke-width: 1.5; }
.rail-divider { height: 0.5px; background: var(--line); margin: 12px 16px; }

/* Main content */
.main { flex: 1; overflow-y: auto; background: var(--bg); }
.main::-webkit-scrollbar { width: 8px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.main::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }

.page { padding: 32px 40px 64px; max-width: 1280px; }
.page.narrow { max-width: 920px; }

/* ========================================================================
   TYPOGRAPHY PRIMITIVES
======================================================================== */

.eyebrow {
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
}
.h1 {
  font-family: var(--serif);
  font-size: 38px;
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.h2 {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.h3 {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 500;
  line-height: 1.3;
  color: var(--ink);
}
.h4 {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  text-transform: none;
  letter-spacing: 0;
}
.lede {
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 64ch;
}
.body-text { font-size: 13px; line-height: 1.65; color: var(--ink-2); }
.muted { color: var(--ink-3); }
.tiny { font-size: 11px; }

.section-head {
  margin: 40px 0 16px;
  display: flex;
  align-items: baseline;
  gap: 16px;
}
.section-head .eyebrow { padding-bottom: 2px; }
.section-head .meta { margin-left: auto; font-size: 11px; color: var(--ink-3); }

/* Hairline divider */
.divider { height: 0.5px; background: var(--line); margin: 24px 0; }

/* ========================================================================
   COMPONENTS
======================================================================== */

/* Cards — distinguished by background + hairline outline, never shadow */
.card {
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}
.card-tight { padding: 14px 16px; }
.card-loose { padding: 28px 32px; }

/* Inline pills/chips */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: 0.04em;
  border-radius: 10px;
  border: 0.5px solid var(--line-2);
  color: var(--ink-2);
  background: var(--bg-2);
  text-transform: uppercase;
}
.pill.ok { background: var(--ok-tint); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-tint); color: var(--warn); border-color: transparent; }
.pill.alert { background: var(--alert-tint); color: var(--alert); border-color: transparent; }
.pill.agent { background: var(--agent-tint); color: var(--agent); border-color: transparent; }
.pill.accent { background: var(--accent-tint); color: var(--accent); border-color: transparent; }

/* Status dot */
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.alert { background: var(--alert); }
.dot.neutral { background: var(--ink-4); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 14px;
  cursor: pointer;
  border: 0.5px solid transparent;
  transition: opacity 0.12s, background 0.12s;
  font-family: var(--sans);
}
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { opacity: 0.88; }
.btn-secondary { background: transparent; color: var(--ink-2); border-color: var(--line-2); }
.btn-secondary:hover { color: var(--ink); border-color: var(--line-strong); }
.btn-text {
  background: none;
  padding: 0;
  color: var(--ink-2);
  font-weight: 400;
  border-radius: 0;
}
.btn-text:hover { color: var(--ink); }
.btn-text .chev { margin-left: 4px; }

/* Icon helpers — using inline SVG, never emoji */
.icon { display: inline-flex; align-items: center; justify-content: center; }
.icon svg { stroke-width: 1.5; }

/* Tables — financial table style */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
table thead th {
  text-align: left;
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
  padding: 8px 12px;
  border-bottom: 0.5px solid var(--line);
  background: var(--bg-2);
}
table tbody td {
  padding: 10px 12px;
  border-bottom: 0.5px solid var(--line);
  color: var(--ink-2);
  vertical-align: top;
}
table tbody tr:hover { background: var(--surface-2); }
.right { text-align: right; }
.num-col { font-variant-numeric: tabular-nums; text-align: right; }

/* Code blocks */
.code-block {
  background: var(--bg-2);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 18px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.65;
  color: var(--ink-2);
  overflow-x: auto;
  white-space: pre;
}
.code-block .kw { color: var(--accent); }
.code-block .str { color: var(--ok); }
.code-block .cm { color: var(--ink-4); font-style: italic; }
.code-block .fn { color: var(--agent); }

/* ========================================================================
   PAGE-SPECIFIC LAYOUTS
======================================================================== */

/* Grid utilities */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }

/* ========================================================================
   VISION PAGE
======================================================================== */

.vision-hero {
  padding: 40px 0 32px;
  border-bottom: 0.5px solid var(--line);
  margin-bottom: 32px;
}
.vision-hero .eyebrow { margin-bottom: 18px; }
.vision-hero .h1 { max-width: 22ch; margin-bottom: 18px; }
.vision-hero .lede { max-width: 60ch; }

.maturity-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.pillar-card {
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.pillar-card .eyebrow { color: var(--accent); }
.pillar-card .pillar-name {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  line-height: 1.2;
  color: var(--ink);
}
.pillar-card .pillar-desc {
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink-2);
}

.maturity-track {
  position: relative;
  margin-top: 8px;
  padding-top: 24px;
}
.maturity-bar {
  position: relative;
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
}
.maturity-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--ink-2);
  border-radius: 2px;
}
.maturity-marker {
  position: absolute;
  top: -7px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--ink);
  transform: translateX(-50%);
}
.maturity-marker.target {
  background: var(--accent);
  border-color: var(--accent);
}
.maturity-marker-label {
  position: absolute;
  top: -28px;
  transform: translateX(-50%);
  font-size: 9px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
  white-space: nowrap;
}
.maturity-marker.target .maturity-marker-label { color: var(--accent); }
.maturity-stages {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
  font-size: 10px;
  font-family: var(--mono);
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.pillar-gap {
  display: flex;
  gap: 24px;
  padding-top: 8px;
  border-top: 0.5px solid var(--line);
  margin-top: 4px;
}
.pillar-gap-item { display: flex; flex-direction: column; gap: 2px; }
.pillar-gap-label { font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; font-family: var(--mono); }
.pillar-gap-val { font-family: var(--serif); font-size: 18px; font-weight: 500; color: var(--ink); }

.vision-prize {
  margin-top: 40px;
  padding: 32px 40px;
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 48px;
  align-items: center;
}
.prize-stat {
  font-family: var(--serif);
  font-size: 56px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.prize-stat-label {
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 12px;
}
.prize-narrative { font-size: 14px; line-height: 1.7; color: var(--ink-2); }
.prize-narrative b { color: var(--ink); font-weight: 500; }

/* ========================================================================
   DIAGNOSE PAGE — Signal feed
======================================================================== */

.signal-summary {
  margin-bottom: 24px;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--ink);
  max-width: 56ch;
}
.signal-summary b { font-weight: 500; }
.signal-summary .amt { color: var(--alert); }

.signal-card {
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 12px;
  position: relative;
  transition: border-color 0.15s;
}
.signal-card:hover { border-color: var(--line-strong); }
.signal-card.alert { border-left: 2px solid var(--alert); }
.signal-card.warn { border-left: 2px solid var(--warn); }
.signal-card.info { border-left: 2px solid var(--accent); }

.signal-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.signal-pattern {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.signal-conf { margin-left: auto; font-size: 11px; color: var(--ink-3); }

.signal-headline {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  line-height: 1.25;
  color: var(--ink);
  margin-bottom: 14px;
  max-width: 56ch;
}

.signal-body { font-size: 13px; line-height: 1.7; color: var(--ink-2); margin-bottom: 14px; max-width: 68ch; }
.signal-body p { margin-bottom: 10px; }
.signal-body p:last-child { margin-bottom: 0; }
.signal-body b { color: var(--ink); font-weight: 500; }
.signal-body .amt { font-weight: 500; color: var(--ink); }

.signal-footer {
  display: flex;
  align-items: center;
  gap: 24px;
  padding-top: 12px;
  border-top: 0.5px solid var(--line);
}
.signal-footer .stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.signal-footer .stat-label {
  font-size: 9px;
  font-family: var(--mono);
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.signal-footer .stat-val {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}
.signal-footer .actions { margin-left: auto; display: flex; gap: 20px; }

/* ========================================================================
   DIAGNOSTIC DESCENT
======================================================================== */

.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); margin-bottom: 20px; }
.breadcrumb a { cursor: pointer; }
.breadcrumb a:hover { color: var(--ink); }
.breadcrumb .sep { color: var(--ink-4); }
.breadcrumb .current { color: var(--ink); }

.descent-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 0.5px solid var(--line);
}
.descent-header .eyebrow { margin-bottom: 10px; }
.descent-header .h2 { max-width: 40ch; margin-bottom: 12px; }
.descent-header .lede { max-width: 64ch; }

/* Three-lever decomposition — editorial bar, not a chart */
.lever-bar {
  display: flex;
  width: 100%;
  height: 56px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin: 14px 0 12px;
}
.lever-seg {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  padding: 0 16px;
  color: #fff;
  position: relative;
}
.lever-seg + .lever-seg { border-left: 1px solid rgba(255,255,255,0.15); }
.lever-seg-name { font-size: 11px; font-weight: 500; letter-spacing: 0.01em; }
.lever-seg-val { font-size: 16px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }

.lever-columns {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 8px;
}
.lever-col { border-top: 3px solid var(--line); padding-top: 14px; }
.lever-col-name { font-family: var(--serif); font-size: 17px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
.lever-col-tag { font-size: 9px; font-family: var(--mono); color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
.lever-col-text { font-size: 12.5px; line-height: 1.65; color: var(--ink-2); margin-bottom: 10px; }
.lever-col-drill { font-size: 11px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.lever-col-drill:hover { color: var(--ink); }

/* Evidence ladder — forensic chain */
.ladder {
  position: relative;
  padding-left: 24px;
  margin-top: 16px;
}
.ladder::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 6px;
  bottom: 32px;
  width: 0.5px;
  background: var(--line-strong);
}
.ladder-step {
  position: relative;
  padding: 14px 0 14px 14px;
  margin-bottom: 0;
  border-bottom: 0.5px solid var(--line);
}
.ladder-step:last-child { border-bottom: none; }
.ladder-step::before {
  content: '';
  position: absolute;
  left: -24px;
  top: 18px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line-strong);
}
.ladder-step.final::before { background: var(--ok); border-color: var(--ok); }
.ladder-step-label {
  font-size: 9px;
  font-family: var(--mono);
  color: var(--ink-3);
  letter-spacing: 0.10em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.ladder-step-fact { font-family: var(--serif); font-size: 16px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
.ladder-step-why { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; line-height: 1.55; }
.ladder-step-src { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.ladder-step-src .lbl { color: var(--ink-4); }
.ladder-step-link { float: right; font-size: 11px; color: var(--ink-2); cursor: pointer; }
.ladder-step-link:hover { color: var(--ink); text-decoration: underline; }

/* Action recommendation — bottom of descent */
.recommend {
  margin-top: 28px;
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
}
.recommend .eyebrow { color: var(--accent); margin-bottom: 8px; }
.recommend .h3 { margin-bottom: 14px; }
.recommend-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 18px; }
.recommend-stat { display: flex; flex-direction: column; gap: 4px; }
.recommend-stat-label { font-size: 10px; font-family: var(--mono); color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.recommend-stat-val { font-family: var(--serif); font-size: 22px; font-weight: 500; color: var(--ink); }
.recommend-stat-sub { font-size: 11px; color: var(--ink-3); }
.recommend-cta { display: flex; align-items: center; gap: 24px; padding-top: 16px; border-top: 0.5px solid var(--line); }

/* Hypothesis tree node */
.hypo-tree {
  margin-top: 32px;
  padding: 24px;
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
}
.hypo-tree .eyebrow { margin-bottom: 4px; }
.hypo-tree-title { font-size: 13px; color: var(--ink-2); margin-bottom: 20px; }
.hypo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.hypo-node {
  border: 0.5px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 14px;
  background: var(--bg-2);
  position: relative;
}
.hypo-node-status { position: absolute; top: 14px; right: 14px; }
.hypo-node-label { font-size: 9px; font-family: var(--mono); color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.hypo-node-claim { font-size: 12.5px; line-height: 1.5; color: var(--ink); margin-bottom: 8px; font-weight: 500; }
.hypo-node-src { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }

/* ========================================================================
   ROADMAP PAGE
======================================================================== */

.roadmap-hero {
  padding-bottom: 24px;
  border-bottom: 0.5px solid var(--line);
  margin-bottom: 28px;
}

.roadmap-timeline {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 32px;
  margin-top: 24px;
}

.phase {
  border-left: 0.5px solid var(--line-2);
  padding: 0 0 32px 24px;
  margin-left: 8px;
  position: relative;
}
.phase:last-child { border-left-color: transparent; padding-bottom: 0; }
.phase::before {
  content: '';
  position: absolute;
  left: -7px;
  top: 0;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--surface);
  border: 1.5px solid var(--ink);
}
.phase.now::before { background: var(--ink); }
.phase-meta {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.phase-title { font-family: var(--serif); font-size: 22px; font-weight: 500; color: var(--ink); margin-bottom: 12px; max-width: 32ch; }
.phase-desc { font-size: 13px; line-height: 1.65; color: var(--ink-2); margin-bottom: 16px; max-width: 60ch; }

.phase-items {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 16px;
}
.phase-item {
  background: var(--bg-2);
  border: 0.5px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.phase-item-label { font-size: 9px; font-family: var(--mono); color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
.phase-item-text { font-size: 12px; line-height: 1.55; color: var(--ink-2); }
.phase-item-text b { color: var(--ink); font-weight: 500; }

.phase-prize {
  margin-top: 18px;
  padding: 14px 16px;
  background: var(--ok-tint);
  border-left: 2px solid var(--ok);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--ink);
  line-height: 1.55;
}
.phase-prize b { color: var(--ok); font-weight: 500; }

/* ========================================================================
   AGENT PAGE
======================================================================== */

.agent-container {
  max-width: 760px;
}
.agent-intro { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 0.5px solid var(--line); }

.agent-suggestion-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 32px;
}
.agent-suggestion {
  padding: 8px 14px;
  border: 0.5px solid var(--line-2);
  border-radius: 20px;
  font-size: 12px;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 0.12s;
  background: var(--surface);
}
.agent-suggestion:hover { border-color: var(--agent); color: var(--ink); background: var(--agent-tint); }

.agent-context {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--bg-2);
  border: 0.5px solid var(--line);
  border-radius: 20px;
  font-size: 11px;
  color: var(--ink-3);
  margin-bottom: 16px;
  width: fit-content;
}
.agent-context .dot { background: var(--agent); }

.msg-user {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 20px;
}
.msg-user-bubble {
  background: var(--bg-2);
  border: 0.5px solid var(--line);
  padding: 10px 14px;
  border-radius: var(--radius-lg);
  font-size: 13px;
  max-width: 75%;
  line-height: 1.55;
  color: var(--ink);
}

.msg-agent {
  display: flex;
  gap: 14px;
  margin-bottom: 32px;
}
.msg-agent::before {
  content: '';
  width: 2px;
  background: var(--agent);
  flex-shrink: 0;
  border-radius: 2px;
}
.msg-agent-body { flex: 1; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.msg-agent-body h4 { font-family: var(--serif); font-size: 16px; font-weight: 500; color: var(--ink); margin-bottom: 10px; margin-top: 0; }
.msg-agent-body p { margin-bottom: 12px; }
.msg-agent-body p:last-child { margin-bottom: 0; }
.msg-agent-body ul { padding-left: 20px; margin-bottom: 12px; }
.msg-agent-body li { margin-bottom: 6px; }
.msg-agent-body b { color: var(--ink); font-weight: 500; }

.msg-citation {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  font-size: 9px;
  background: var(--agent-tint);
  color: var(--agent);
  border-radius: 50%;
  font-weight: 600;
  margin: 0 1px;
  vertical-align: super;
  font-feature-settings: 'tnum';
  cursor: pointer;
}

.agent-input-wrap {
  position: sticky;
  bottom: 0;
  padding: 20px 0;
  background: linear-gradient(to bottom, transparent 0%, var(--bg) 30%);
}
.agent-input {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0.5px solid var(--line-strong);
  border-radius: 24px;
  padding: 4px 6px 4px 18px;
  background: var(--surface);
}
.agent-input input {
  flex: 1;
  border: none;
  background: none;
  outline: none;
  font-size: 13px;
  padding: 10px 0;
}
.agent-send {
  width: 36px; height: 36px;
  background: var(--ink);
  color: var(--bg);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* ========================================================================
   CONFIGURE PAGE
======================================================================== */

.cfg-grid { display: grid; grid-template-columns: 220px 1fr; gap: 32px; }
.cfg-sidenav { display: flex; flex-direction: column; gap: 2px; }
.cfg-nav-section {
  font-size: 9px;
  font-family: var(--mono);
  color: var(--ink-4);
  letter-spacing: 0.10em;
  text-transform: uppercase;
  padding: 16px 12px 6px;
}
.cfg-nav-item {
  padding: 8px 12px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  border-radius: var(--radius-sm);
  border-left: 2px solid transparent;
}
.cfg-nav-item:hover { color: var(--ink); background: var(--bg-2); }
.cfg-nav-item.active { color: var(--ink); border-left-color: var(--ink); background: var(--bg-2); font-weight: 500; }

.conn-card {
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 16px;
}
.conn-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 0.5px solid var(--line); }
.conn-card-head .h4 { font-size: 14px; }
.conn-card-head .pill { margin-left: auto; }

.conn-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
.conn-meta-item { display: flex; flex-direction: column; gap: 2px; }
.conn-meta-label { font-size: 10px; font-family: var(--mono); color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.conn-meta-val { font-size: 13px; color: var(--ink); font-family: var(--mono); }

/* ========================================================================
   METRICS PAGE · the analyst-facing twin of the CFO-facing Diagnose
======================================================================== */

.metrics-areas {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}

.area-card {
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.15s;
}
.area-card.open {
  border-color: var(--line-strong);
}
.area-head {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s;
}
.area-head:hover { background: var(--surface-2); }
.area-head .chev-marker {
  width: 14px; height: 14px;
  transition: transform 0.18s;
  color: var(--ink-3);
  flex-shrink: 0;
}
.area-card.open .chev-marker { transform: rotate(90deg); }
.area-head-main { flex: 1; min-width: 0; }
.area-name {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.area-desc {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 3px;
  line-height: 1.5;
}
.area-summary {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-shrink: 0;
}
.area-stat {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}
.area-stat-val {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
}
.area-stat-val.alert { color: var(--alert); }
.area-stat-val.warn { color: var(--warn); }
.area-stat-val.ok { color: var(--ok); }
.area-stat-label {
  font-size: 9px;
  font-family: var(--mono);
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.area-body {
  display: none;
  border-top: 0.5px solid var(--line);
  padding: 6px 0;
  background: var(--bg-2);
}
.area-card.open .area-body { display: block; }

.metric-row {
  display: grid;
  grid-template-columns: 1fr 90px 80px 80px 220px 80px 100px;
  gap: 16px;
  padding: 12px 22px;
  align-items: center;
  cursor: pointer;
  border-bottom: 0.5px solid var(--line);
  transition: background 0.12s;
}
.metric-row:last-child { border-bottom: none; }
.metric-row:hover { background: var(--surface); }
.metric-row.has-signal { border-left: 2px solid var(--alert); padding-left: 20px; }

.metric-row-name {
  font-size: 13px;
  color: var(--ink);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
}
.metric-row-name .lvl {
  font-size: 9px;
  font-family: var(--mono);
  color: var(--ink-3);
  background: var(--bg-3);
  padding: 1px 5px;
  border-radius: 3px;
  letter-spacing: 0.04em;
}
.metric-row-val {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 500;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.metric-row-val.alert { color: var(--alert); }
.metric-row-val.warn { color: var(--warn); }
.metric-row-val.ok { color: var(--ok); }
.metric-row-bic {
  font-size: 11px;
  color: var(--ok);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.metric-row-delta {
  font-size: 11px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.metric-row-delta.bad { color: var(--alert); }
.metric-row-delta.good { color: var(--ok); }

.metric-row-bench {
  position: relative;
  height: 24px;
}
.metric-row-bench-track {
  position: absolute;
  left: 0; right: 0; top: 10px;
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
}
.metric-row-bench-pin {
  position: absolute;
  top: 4px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--ink);
  transform: translateX(-50%);
  z-index: 2;
}
.metric-row-bench-pin.bic { background: var(--ok); border-color: var(--ok); width: 7px; height: 7px; top: 8.5px; }
.metric-row-bench-pin.median { background: var(--warn); border-color: var(--warn); width: 7px; height: 7px; top: 8.5px; }
.metric-row-bench-pin.lag { background: var(--alert); border-color: var(--alert); width: 7px; height: 7px; top: 8.5px; }
.metric-row-bench-tick-row {
  display: flex;
  justify-content: space-between;
  margin-top: 18px;
  font-size: 9px;
  font-family: var(--mono);
  color: var(--ink-4);
}

.metric-row-tag {
  display: flex;
  justify-content: flex-end;
}
.metric-row-action {
  font-size: 11px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
}
.metric-row:hover .metric-row-action { color: var(--ink); }

/* Metric detail panel */
.metric-detail-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-3);
  font-size: 12px;
  margin-bottom: 16px;
  cursor: pointer;
}
.metric-detail-back:hover { color: var(--ink); }
.metric-detail-back svg { width: 14px; height: 14px; }

.md-hero {
  padding-bottom: 24px;
  border-bottom: 0.5px solid var(--line);
  margin-bottom: 28px;
}
.md-hero .eyebrow { margin-bottom: 8px; }
.md-hero .area-tag {
  display: inline-block;
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-left: 8px;
}
.md-hero h1 { margin-bottom: 18px; max-width: 32ch; }
.md-hero .stats-row { display: flex; gap: 40px; flex-wrap: wrap; margin-top: 4px; }
.md-stat { display: flex; flex-direction: column; gap: 3px; }
.md-stat-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.md-stat-val { font-family: var(--serif); font-size: 32px; font-weight: 500; color: var(--ink); line-height: 1.1; }
.md-stat-val.alert { color: var(--alert); }
.md-stat-val.warn { color: var(--warn); }
.md-stat-val.ok { color: var(--ok); }
.md-stat-sub { font-size: 11px; color: var(--ink-3); }

/* Benchmark track for metric detail */
.bench-detail {
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  padding: 28px 32px 24px;
  margin-bottom: 24px;
}
.bench-detail .eyebrow { margin-bottom: 24px; }
.bench-track {
  position: relative;
  height: 100px;
  margin: 0 24px;
}
.bench-track-line {
  position: absolute;
  left: 0; right: 0; top: 48px;
  height: 3px;
  background: var(--bg-3);
  border-radius: 2px;
}
.bench-pin {
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  transform: translateX(-50%);
  top: 44px;
  z-index: 2;
}
.bench-pin.bic { background: var(--ok); }
.bench-pin.median { background: var(--warn); }
.bench-pin.lag { background: var(--alert); }
.bench-pin.you {
  width: 18px; height: 18px;
  top: 41px;
  background: var(--ink);
  border: 3px solid var(--bg);
  box-shadow: 0 0 0 1.5px var(--ink);
  z-index: 3;
}
.bench-pin-label {
  position: absolute;
  top: 64px;
  transform: translateX(-50%);
  font-size: 10px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ink-3);
  white-space: nowrap;
}
.bench-pin-val {
  position: absolute;
  bottom: 60px;
  transform: translateX(-50%);
  font-size: 12px;
  font-family: var(--serif);
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
}
.bench-gaps {
  display: flex;
  gap: 12px;
  margin-top: 28px;
  flex-wrap: wrap;
}
.bench-gap {
  background: var(--bg-2);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.bench-gap-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.bench-gap-val { font-family: var(--serif); font-size: 18px; font-weight: 500; color: var(--ink); }
.bench-gap-val.alert { color: var(--alert); }
.bench-gap-val.ok { color: var(--ok); }

/* Root cause prose block */
.rc-block {
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 28px;
  margin-bottom: 24px;
}
.rc-block .eyebrow { margin-bottom: 10px; }
.rc-block .rc-prose { font-size: 14px; line-height: 1.75; color: var(--ink-2); max-width: 72ch; }
.rc-block .rc-prose b { color: var(--ink); font-weight: 500; }

/* Sub-KPI grid */
.subkpi-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.subkpi-card {
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color 0.15s;
  position: relative;
}
.subkpi-card:hover { border-color: var(--line-strong); }
.subkpi-card.alert { border-left: 2px solid var(--alert); }
.subkpi-card.warn { border-left: 2px solid var(--warn); }
.subkpi-card.ok { border-left: 2px solid var(--ok); }
.subkpi-name { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; font-weight: 500; }
.subkpi-val { font-family: var(--serif); font-size: 22px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.subkpi-val.alert { color: var(--alert); }
.subkpi-val.warn { color: var(--warn); }

// Helper: format metric value for display
function fmtMetric(m) {
  if (m.val == null) return '—';
  if (m.unit === '$') {
    if (Math.abs(m.val) >= 1000000) return '$' + (m.val / 1000000).toFixed(1) + 'M';
    if (Math.abs(m.val) >= 1000) return '$' + (m.val / 1000).toFixed(0) + 'K';
    return '$' + m.val.toLocaleString();
  }
  if (m.unit === '$M') return '$' + m.val + 'M';
  if (m.unit === '%') return m.val + '%';
  if (m.unit === 'days') return m.val + 'd';
  if (m.unit === '') return m.val.toLocaleString();
  return m.val + (m.unit ? ' ' + m.unit : '');
}

// Helper: benchmark position percentage
function benchPosition(m) {
  if (m.bic == null || m.laggard == null) return null;
  const range = m.laggard - m.bic;
  if (range === 0) return 50;
  const pos = ((m.val - m.bic) / range) * 100;
  return Math.max(3, Math.min(97, pos));
}

function navTo(page) {

  STATE.selectedMetric = null;

    STATE.metricArea = 'block-mgmt';  // open Block Mgmt by default - highest impact
  }
  renderShell();
  document.querySelector('.main').scrollTop = 0;
}

function renderPage() {
  const main = document.getElementById('main-content');
  if (STATE.selectedSignal) {
    main.innerHTML = renderDescent(STATE.selectedSignal);
    return;
  }
  if (STATE.selectedMetric) {
    main.innerHTML = renderMetricDetail(STATE.selectedMetric);
    return;
  }
  if (STATE.page === 'vision') main.innerHTML = renderVision();
  else if (STATE.page === 'diagnose') main.innerHTML = renderDiagnose();
  else if (STATE.page === 'metrics') main.innerHTML = renderMetrics();
  else if (STATE.page === 'roadmap') main.innerHTML = renderRoadmap();
  else if (STATE.page === 'agent') main.innerHTML = renderAgent();
  else if (STATE.page === 'configure') main.innerHTML = renderConfigure();
}

  const l3Metrics = Object.values(METRICS).filter(m => m.level === 'L3');
  const alertCount = l2Metrics.filter(m => m.status === 'alert').length;
  const warnCount = l2Metrics.filter(m => m.status === 'warn').length;
  const okCount = l2Metrics.filter(m => m.status === 'ok').length;
  return `<div class="page fade-in">

      <p class="lede">Five process areas. ${l2Metrics.length} L2 metrics. ${l3Metrics.length} L3 contributing factors. Each metric is benchmarked against best-in-class, peer median, and laggard. Click any metric to see its diagnostic depth — root cause, contributing sub-KPIs, recommended actions, and the linked signal if one has fired.</p>

      ${Object.values(METRIC_AREAS).map(area => renderAreaCard(area)).join('')}
    </div>
  </div>`;
}

function renderAreaCard(area) {
  const isOpen = STATE.metricArea === area.id;
  const metrics = area.metrics.map(id => METRICS[id]).filter(m => m && m.level === 'L2');
  const alertCount = metrics.filter(m => m.status === 'alert').length;
  const warnCount = metrics.filter(m => m.status === 'warn').length;
  const overall = alertCount > 0 ? 'alert' : warnCount > 0 ? 'warn' : 'ok';
  const overallLabel = alertCount > 0 ? `${alertCount} CRITICAL` : warnCount > 0 ? `${warnCount} WATCH` : 'HEALTHY';

  return `<div class="area-card ${isOpen ? 'open' : ''}" id="area-${area.id}">
    <div class="area-head" onclick="toggleArea('${area.id}')">
      <span class="icon chev-marker">${ICONS.chev}</span>
      <div class="area-head-main">
        <div class="area-name">${area.name}</div>
        <div class="area-desc">${area.desc}</div>
      </div>
      <div class="area-summary">
        <div class="area-stat">
          <div class="area-stat-val ${overall}">${overallLabel}</div>
          <div class="area-stat-label">${metrics.length} metrics</div>
        </div>
      </div>
    </div>
    <div class="area-body">
      ${metrics.map(m => renderMetricRow(m)).join('')}
    </div>
  </div>`;
}

function renderMetricRow(m) {
  const benchPos = benchPosition(m);
  const hasBench = benchPos !== null;
  const hasSignal = !!m.signal;
  const deltaCls = m.vsplan
    ? (m.vsplan.startsWith('+') && m.hib ? 'bad' : m.vsplan.startsWith('−') && m.hib ? 'good' : m.vsplan.startsWith('+') && !m.hib ? 'good' : 'bad')
    : '';

  return `<div class="metric-row ${hasSignal ? 'has-signal' : ''}" onclick="openMetric('${m.id}')">
    <div class="metric-row-name">
      <span class="lvl">${m.level}</span>
      <span>${m.name}</span>
    </div>
    <div class="metric-row-val ${m.status}">${fmtMetric(m)}</div>
    <div class="metric-row-bic">${m.bic != null ? 'BIC ' + m.bic + m.unit : ''}</div>
    <div class="metric-row-delta ${deltaCls}">${m.vsplan || ''}</div>
    <div class="metric-row-bench">
      ${hasBench ? `
        <div class="metric-row-bench-track"></div>
        <div class="metric-row-bench-pin bic" style="left: 3%"></div>
        <div class="metric-row-bench-pin median" style="left: ${((m.median - m.bic) / (m.laggard - m.bic) * 94) + 3}%"></div>
        <div class="metric-row-bench-pin lag" style="left: 97%"></div>
        <div class="metric-row-bench-pin" style="left: ${benchPos}%; background: var(--ink); border-color: var(--ink);"></div>
      ` : ''}
    </div>
    <div class="metric-row-tag">
      ${hasSignal ? `<span class="pill alert" style="cursor:pointer" onclick="event.stopPropagation();openSignal('${m.signal}')" title="Click to investigate the signal">SIGNAL ›</span>` : `<span class="dot ${m.status}"></span>`}
    </div>
    <div class="metric-row-action">
      Drill in <span class="chev" style="display: inline-flex; align-items: center;">${ICONS.chev}</span>
    </div>
  </div>`;
}

function toggleArea(id) {
  STATE.metricArea = (STATE.metricArea === id) ? null : id;
  document.getElementById('main-content').innerHTML = renderMetrics();
}

function openMetric(id) {
  STATE.selectedMetric = id;
  STATE.selectedSubKpi = null;
  renderPage();
  document.querySelector('.main').scrollTop = 0;
}
function closeMetric() {
  STATE.selectedMetric = null;
  STATE.selectedSubKpi = null;

}

  const deltaCls = m.vsplan && m.hib != null
    ? (m.vsplan.startsWith('+') && m.hib ? 'bad' : m.vsplan.startsWith('−') && m.hib ? 'good' : m.vsplan.startsWith('+') && !m.hib ? 'good' : 'bad')

  const childIds = m.children || [];
  const subKpis = childIds.map(cid => METRICS[cid]).filter(k => k);

  // Linked signal
  const linkedSignal = m.signal ? SIGNALS[m.signal] : null;

  return `<div class="page fade-in">
    <span class="metric-detail-back" onclick="closeMetric()">${ICONS.back} Back to metrics</span>

          <div class="md-stat-val ${m.status}">${fmtMetric(m)}</div>
        </div>
        ${m.bic != null ? `
          <div class="md-stat">
            <div class="md-stat-label">Best-in-class</div>
            <div class="md-stat-val ok">${m.bic}${m.unit}</div>
            <div class="md-stat-sub">target</div>
          </div>
        ` : ''}
        ${m.median != null ? `
          <div class="md-stat">
            <div class="md-stat-label">Peer median</div>
            <div class="md-stat-val">${m.median}${m.unit}</div>
          </div>
        ` : ''}
        ${m.vsplan ? `
          <div class="md-stat">
            <div class="md-stat-label">vs Plan</div>
            <div class="md-stat-val ${deltaCls === 'bad' ? 'alert' : deltaCls === 'good' ? 'ok' : ''}">${m.vsplan}</div>
          </div>
        ` : ''}
      </div>
    </div>

    ${linkedSignal ? `
      <div class="linked-signal">
        <span class="linked-signal-icon">${ICONS.alert}</span>
        <div class="linked-signal-text">
          <b>An active signal has fired on this metric.</b> ${linkedSignal.pattern} — ${linkedSignal.headline.split('—')[0].trim()}.
        </div>
        <span class="linked-signal-cta" onclick="openSignal('${linkedSignal.id}')">Investigate signal <span class="chev">›</span></span>
      </div>

        <div class="eyebrow">Benchmark position</div>

          <div class="bench-pin bic" style="left: 3%"></div>

          <div class="bench-pin median" style="left: ${((m.median - m.bic) / (m.laggard - m.bic) * 94) + 3}%"></div>
          <div class="bench-pin-val" style="left: ${((m.median - m.bic) / (m.laggard - m.bic) * 94) + 3}%; color: var(--warn)">${m.median}${m.unit}</div>

          <div class="bench-pin lag" style="left: 97%"></div>
          <div class="bench-pin-val" style="left: 97%; color: var(--alert)">${m.laggard}${m.unit}</div>

          <div class="bench-pin you" style="left: ${benchPos}%"></div>
          <div class="bench-pin-val" style="left: ${benchPos}%; bottom: 78px; font-size: 13px; color: var(--ink); font-weight: 600;">YOU · ${fmtMetric(m)}</div>

            ? (k.vsplan.startsWith('+') && k.hib ? 'bad' : k.vsplan.startsWith('−') && k.hib ? 'good' : k.vsplan.startsWith('+') && !k.hib ? 'good' : 'bad')

      <span class="agent-suggestion" onclick="askAgent('What changed in credit configuration this month?')">What changed in credit configuration?</span>
      <span class="agent-suggestion" onclick="askAgent('Walk me through the dispute concentration pattern')">Walk me through the dispute concentration pattern</span>
    </div>

    <div id="conversation">
      ${renderConversation()}
    </div>

    <div class="agent-input-wrap">
      <div class="agent-input">

      </div>
    </div>

    ${renderContextFooter()}

function renderConversation() {
  return STATE.conversation.map(m => {
    if (m.role === 'user') {
      return `<div class="msg-user"><div class="msg-user-bubble">${m.text}</div></div>`;
    }
    return `<div class="msg-agent"><div class="msg-agent-body">${m.html}</div></div>`;
  }).join('');
}

function askAgent(q) {
  STATE.conversation = [{ role: 'user', text: q }, STATE.conversation[1] || STATE.conversation[0]];
  renderPage();
}
function sendAgent() {
  const q = document.getElementById('agent-q').value.trim();
  if (!q) return;
  STATE.conversation.push({ role: 'user', text: q });
  STATE.conversation.push({ role: 'agent', html: `<p>That question reaches outside the demo's pre-loaded responses. In production, the agent grounds its response in your canonical AR + pattern catalog + corpus, and cites every claim.</p><p>For this demo, try one of the suggested questions above.</p>` });
  renderPage();
}

function renderConfigLineage() {
  return `
    <div class="card card-loose">
      <div class="eyebrow" style="color: var(--accent);">DATA FLOW · BRONZE → SILVER → GOLD</div>
      <h3 class="h3" style="margin: 8px 0 18px;">Three layers, one trust contract.</h3>
      <p class="body-text" style="max-width: 64ch; margin-bottom: 24px;">
        Every dollar value in this application traces from a specific SAP source field, through a documented canonical entity, into a GL-reconciled mart. The reconciliation harness runs hourly. The data lineage is visible end-to-end.
      </p>

      <div style="margin-bottom: 24px;">
        <div class="eyebrow" style="margin-bottom: 8px;">Layer 1 · Bronze (raw)</div>
        <p class="body-text" style="max-width: 64ch;">18 SAP tables replicated 1:1 via SLT change-data-capture. No transformation. Same schema as SAP. This is the audit-defensible "this is what was in SAP at timestamp T" surface.</p>
        <div class="code-block" style="margin-top: 10px;"><span class="cm">-- Bronze · CDC merge from SAP SLT, 15-min cadence</span>
<span class="kw">MERGE INTO</span> bronze.sap_bsid <span class="kw">AS</span> tgt
<span class="kw">USING</span> landing.sap_bsid_cdc <span class="kw">AS</span> src
<span class="kw">ON</span> tgt.BUKRS = src.BUKRS <span class="kw">AND</span> tgt.BELNR = src.BELNR
<span class="kw">WHEN MATCHED</span> <span class="kw">THEN UPDATE SET</span> *
<span class="kw">WHEN NOT MATCHED</span> <span class="kw">THEN INSERT</span> *;</div>
      </div>

      <div style="margin-bottom: 24px;">
        <div class="eyebrow" style="margin-bottom: 8px;">Layer 2 · Silver (canonical)</div>
        <p class="body-text" style="max-width: 64ch;">Bronze translated into canonical business entities — AR line item, billing, delivery, dispute. Date logic resolved once. Filters applied. Schema portable across ECC and S/4. This is the IP that transfers to the client at engagement end.</p>
        <div class="code-block" style="margin-top: 10px;"><span class="cm">-- Silver · canonical AR line item (the heart of the model)</span>
<span class="kw">SELECT</span>
  <span class="fn">CONCAT</span>(BUKRS,<span class="str">'-'</span>,BELNR,<span class="str">'-'</span>,GJAHR,<span class="str">'-'</span>,BUZEI) <span class="kw">AS</span> fi_doc_id,
  <span class="cm">-- baseline date resolved here · BSEG override → T052 rule fallback</span>
  <span class="fn">COALESCE</span>(ZFBDT, <span class="kw">CASE</span> T052.STAGG
    <span class="kw">WHEN</span> <span class="str">'B'</span> <span class="kw">THEN</span> BUDAT
    <span class="kw">WHEN</span> <span class="str">'D'</span> <span class="kw">THEN</span> BLDAT
    <span class="kw">ELSE</span> BLDAT
  <span class="kw">END</span>) <span class="kw">AS</span> baseline_date,
  baseline_date + T052.ZTAGG <span class="kw">AS</span> due_date,
  ...
<span class="kw">FROM</span> bronze.sap_bsid <span class="kw">UNION ALL</span> bronze.sap_bsad
<span class="kw">LEFT JOIN</span> bronze.sap_t052 <span class="kw">USING</span> (ZTERM)
<span class="kw">WHERE</span> KOART = <span class="str">'D'</span> <span class="kw">AND</span> UMSKZ <span class="kw">NOT IN</span> (<span class="str">'A'</span>,<span class="str">'B'</span>,<span class="str">'F'</span>,<span class="str">'P'</span>);</div>
      </div>

      <div style="margin-bottom: 0;">
        <div class="eyebrow" style="margin-bottom: 8px;">Layer 3 · Gold (KPI marts + reconciliation)</div>
        <p class="body-text" style="max-width: 64ch;">DSO, BPDSO, aging, dispute aging — sliced by segment × region × period. Every gold record carries <code style="font-family: var(--mono); background: var(--bg-2); padding: 1px 5px; border-radius: 3px;">reconciliation_status</code>. When variance to GL breaches 0.5%, the trust strip turns amber and downstream signals pause.</p>
        <div class="code-block" style="margin-top: 10px;"><span class="cm">-- Gold · reconciliation harness · runs hourly</span>
<span class="kw">SELECT</span>
  <span class="fn">SUM</span>(open_amount_lc) <span class="kw">AS</span> canonical_ar_total,
  <span class="cm">-- compare to GL reconciliation accounts</span>
  <span class="fn">SUM</span>(gl_balance_lc) <span class="kw">AS</span> gl_ar_total,
  <span class="kw">CASE</span>
    <span class="kw">WHEN</span> <span class="fn">ABS</span>(variance_pct) &lt; 0.001 <span class="kw">THEN</span> <span class="str">'ok'</span>
    <span class="kw">WHEN</span> <span class="fn">ABS</span>(variance_pct) &lt; 0.005 <span class="kw">THEN</span> <span class="str">'drift'</span>
    <span class="kw">ELSE</span> <span class="str">'breach'</span>
  <span class="kw">END</span> <span class="kw">AS</span> status
<span class="kw">FROM</span> silver.ar_line_item_canonical <span class="kw">JOIN</span> silver.gl_balance ...
<span class="cm">// Current: variance 0.04% · ok</span></div>
      </div>
    </div>
  `;
}

    'evidence-2': { title: 'bronze.sap_cdhdr · doc 0099174826', body: renderEvidenceCDHDR() },
    'evidence-3': { title: 'gold__bpdso_daily · subset analysis', body: renderEvidenceBPDSO() },
    'evidence-4': { title: 'semantic__customer_state_history', body: renderEvidenceCohort() },
    'reconciliation': { title: 'Reconciliation history · last 24 hours', body: renderReconciliation() },
    'context-layer': { title: 'O2C Domain Context Layer · ' + CONTEXT_LAYER.version, body: renderContextLayerModal(), eyebrow: 'KNOWLEDGE BASE · INTERPRETED EVIDENCE' }
  };
  const e = evidence[id];
  if (!e) return;
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.onclick = (ev) => { if (ev.target === scrim) closeModal(); };
  scrim.innerHTML = `
    <div class="modal fade-in">
      <button class="modal-close" onclick="closeModal()">${ICONS.x}</button>
      <div class="eyebrow" style="margin-bottom: 6px;">${e.eyebrow || 'EVIDENCE · SNAPSHOT AT FIRE TIME'}</div>
      <h2 class="h2" style="font-size: 22px; margin-bottom: 8px;">${e.title}</h2>
      <div style="margin-top: 18px;">${e.body}</div>
    </div>
  `;
  document.body.appendChild(scrim);
}

function renderContextLayerModal() {

    </p>

    <div class="grid-3" style="margin-bottom: 20px;">
      <div class="card card-tight">
        <div class="eyebrow" style="margin-bottom: 6px;">Finance rules</div>

        <div class="tiny muted">domain logic encoded</div>
      </div>
      <div class="card card-tight">
        <div class="eyebrow" style="margin-bottom: 6px;">SAP field mappings</div>
        <div style="font-family: var(--serif); font-size: 26px; font-weight: 500;">${CONTEXT_LAYER.mappings}</div>
        <div class="tiny muted">canonical → bronze</div>
      </div>
      <div class="card card-tight">
        <div class="eyebrow" style="margin-bottom: 6px;">Active patterns</div>
        <div style="font-family: var(--serif); font-size: 26px; font-weight: 500;">${CONTEXT_LAYER.patterns}</div>
        <div class="tiny muted">deterministic triggers</div>
      </div>
    </div>

    <h4 class="h4" style="margin-bottom: 8px;">What lives in the Context Layer</h4>
    <ul style="margin-bottom: 18px; padding-left: 18px; font-size: 13px; line-height: 1.7; color: var(--ink-2);">
      <li><b style="color: var(--ink);">Domain semantics</b> — what "DSO," "BPDSO," "manual block," "terms drift" mean canonically, regardless of how each client labels them in SAP.</li>
      <li><b style="color: var(--ink);">Calculation rules</b> — baseline-date resolution, special-GL filters, dispute-aging conventions, BIC/Median/Laggard benchmark anchors.</li>
      <li><b style="color: var(--ink);">SAP field mappings</b> — every canonical entity traces to specific SAP fields with explicit join logic and effective-dated overrides.</li>
      <li><b style="color: var(--ink);">Pattern triggers</b> — deterministic SQL templates that compute "signal X fired because conditions A, B, C met against thresholds T1, T2, T3."</li>
      <li><b style="color: var(--ink);">Causal hypotheses</b> — for each pattern, the analyst-grade reasoning that links symptom to root cause, used by the LLM as constrained narrative input.</li>
      <li><b style="color: var(--ink);">Action playbooks</b> — for each pattern, the reversible actions with sized impact, approval class, and SAP write-back path.</li>
    </ul>

    <h4 class="h4" style="margin-bottom: 8px;">Governance</h4>
    <p class="body-text" style="margin-bottom: 6px;">${CONTEXT_LAYER.reviewedBy}.</p>
    <p class="tiny muted">Source frameworks: ${CONTEXT_LAYER.sources}.</p>

    <h4 class="h4" style="margin-top: 18px; margin-bottom: 8px;">Why it matters</h4>
    <p class="body-text">
      Without a Context Layer, the diagnostic intelligence would be hardcoded per-client — slow to deploy, hard to maintain, brittle to SAP version changes. With it, the same accelerator deploys against any S/4HANA or ECC environment in days rather than months, and improves continuously as new client engagements enrich the rule base.
    </p>
  `;
}
function closeModal() {
  const s = document.querySelector('.scrim');
  if (s) s.remove();
}
function openEvidence(name) {

}
