<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Command Center</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .persona{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
  .persona select{background:none;border:none;font-weight:600;cursor:pointer;outline:none}
  .launch{border:1px solid var(--line);border-radius:13px;padding:18px;background:var(--panel);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:12px}
  .launch:hover{border-color:var(--orange-dim);transform:translateY(-2px)}
  .launch.soon{opacity:.6;cursor:default}.launch.soon:hover{transform:none;border-color:var(--line)}
  .launch .lh{display:flex;align-items:center;gap:11px}
  .launch .li{width:38px;height:38px;border-radius:10px;background:var(--orange-tint);color:var(--orange-soft);display:flex;align-items:center;justify-content:center}
  .launch .ln{font-size:14.5px;font-weight:600}.launch .ld{font-size:11px;color:var(--ink-3)}
  .launch .lstats{display:flex;gap:18px;border-top:1px solid var(--line);padding-top:11px}
  .launch .lstat .v{font-size:16px;font-weight:600;font-family:var(--mono)}.launch .lstat .l{font-size:10px;color:var(--ink-3)}
  .agent-cell{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2)}
  .agent-cell .ad{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .agent-cell .ad.active{background:var(--ok);box-shadow:0 0 0 3px var(--ok-tint)}
  .agent-cell .ad.learning{background:var(--agent);box-shadow:0 0 0 3px var(--agent-tint)}
  .agent-cell .ad.idle{background:var(--ink-4)}
  .agent-cell .an{font-size:11.5px;font-weight:500;line-height:1.3}.agent-cell .at{font-size:9.5px;color:var(--ink-3);font-family:var(--mono)}
  .copilot{display:flex;flex-direction:column;height:100%}
  .cp-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:11px}
  .cp-msg{max-width:90%;padding:10px 13px;border-radius:11px;font-size:12.5px;line-height:1.5}
  .cp-msg.user{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:3px}
  .cp-msg.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:3px}
  .cp-msg.bot .mono{color:var(--orange-soft)}
  .cp-in{padding:11px;border-top:1px solid var(--line);display:flex;gap:8px}
  .cp-in input{flex:1;background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;font-size:12.5px;outline:none}
  .cp-in input:focus{border-color:var(--orange-dim)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 11px}
  .chip-q{font-size:10.5px;border:1px solid var(--line-2);border-radius:14px;padding:4px 10px;color:var(--ink-2);cursor:pointer;background:var(--panel-2)}
  .chip-q:hover{border-color:var(--orange-dim);color:var(--orange-soft)}
  .set-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
  .set-row .si{flex:1}.set-row .sl{font-size:12.5px;font-weight:500}.set-row .sk{font-size:10px;color:var(--ink-3);font-family:var(--mono)}
  .switch{width:38px;height:21px;border-radius:12px;background:var(--panel-3);position:relative;cursor:pointer;transition:.15s;flex-shrink:0}
  .switch.on{background:var(--orange)}
  .switch i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on i{left:19px}
  .set-row input.num{width:90px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;font-family:var(--mono);font-size:12px;text-align:right;outline:none}
  .set-row input.num:focus{border-color:var(--orange-dim)}
</style>
</head>
<body>
<div class="app">
  <div class="trust">
    <span class="dot"></span><span>SAP S/4HANA <b>connected</b></span><span class="sep"></span>
    <span>FI-AR sync <b id="syncTs">live</b></span><span class="sep"></span>
    <span>Client <b>100</b> · 5 company codes <b>Americas · EMEA · APAC · Japan · China</b></span>
    <span class="spacer"></span>
    <span id="agentsLive" class="mono">— agents active</span>
  </div>
  <div class="head">
    <div class="mlogo">AR</div>
    <div><div class="title">AR Command Center</div><div class="sub">Order-to-Cash · receivables control tower</div></div>
    <div class="spacer"></div>
    <div class="persona">
      <span style="color:var(--ink-3)">Viewing as</span>
      <select id="persona">
        <option value="cfo">CFO / Finance Leadership</option>
        <option value="arc">AR Controller</option>
        <option value="col">Collections Lead</option>
        <option value="cash">Cash App Lead</option>
      </select>
    </div>
    <button class="btn ghost" id="themeBtn" title="Toggle theme"></button>
  </div>
  <div class="body">
    <div class="nav" id="nav"></div>
    <div class="main with-rail" id="content"></div>
    <div class="rail">
      <div class="rail-h"><span class="t">AI Workforce · Live</span><span class="live"><span class="d"></span>STREAMING</span></div>
      <div class="feed" id="feed"></div>
      <div style="border-top:1px solid var(--line)">
        <div class="rail-h"><span class="t" id="cpTitle">AR Copilot</span></div>
        <div class="copilot" style="height:280px">
          <div class="cp-msgs" id="cpMsgs"></div>
          <div class="chips" id="cpChips"></div>
          <div class="cp-in"><input id="cpInput" placeholder="Ask about DSO, aging, exceptions…"><button class="btn pri sm" id="cpSend"></button></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/command.js"></script>
</body>
</html>
